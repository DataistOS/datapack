# ==============================================================================
# Workflow Name: Create Release
# Description: Automated workflow to build, package, and release Datapack
#              artifacts (Linux Universal & Arch compatible) when a new tag is pushed.
# ==============================================================================

name: Create Release

# Trigger the workflow on pushes to tags matching v* (e.g., v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release Datapack for Linux & Arch
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Linux dependencies required for Flutter desktop building
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libayatana-appindicator3-dev

      # Step 3: Set up Flutter SDK environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # Step 4: Get Flutter packages
      - name: Install Flutter Packages
        run: flutter pub get

      # Step 5: Build the Linux desktop release version
      - name: Build Flutter Linux Release
        run: flutter build linux --release

      # Step 6: Package the compiled release artifacts (Universal Tarball for Linux/Arch)
      - name: Create Distribution Archives
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../DATAPACK-${{ github.ref_name }}-linux-x86_64.tar.gz *
          cd -

      # Step 7: Create Arch Linux compatible archive / structure if needed
      - name: Prepare Arch / Parch Specific Package Artifact
        run: |
          mkdir -p datapack-arch-pkg
          cp -r build/linux/x64/release/bundle/* datapack-arch-pkg/
          tar -czf DATAPACK-${{ github.ref_name }}-arch-x86_64.tar.gz datapack-arch-pkg

      # Step 8: Publish the release and upload the generated assets to GitHub Releases
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            DATAPACK-*-linux-x86_64.tar.gz
            DATAPACK-*-arch-x86_64.tar.gz
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}