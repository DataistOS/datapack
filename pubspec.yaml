# General Section (Metadata)
name: datapack
description: "Datapack is an official tool for managing, installing, uninstalling, and updating DataistOS software packages."
homepage: datapack
documentation: https://dpic.dataist.ir/
version: 0.1.1+1

# Environment
environment:
  sdk: ^3.8.1
# Dependencies
dependencies:
  flutter:
    sdk: flutter
  # GitIgnore
  flutter_dotenv: ^5.2.1
  # URLs
  url_launcher: ^6.3.2
  # Network
  http: ^1.6.0
  # State Management
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  # Equals
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# Flutter specific configurations
flutter:
  uses-material-design: true

  # Assets & Fonts:
  assets:
    - .env
