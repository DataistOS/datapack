# General Section (Metadata)
name: datapack
homepage: datapack
description: "Datapack is an official tool for managing, installing, uninstalling, and updating DataistOS software packages."
issue_tracker: https://github.com/DataistOS/datapack/issues
documentation: https://dpic.dataist.ir/heuristic/_source/category/tools/datapack.html
version: 0.4.0+1

# Environment
environment:
  sdk: ^3.8.1

# Dependencies
dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5+1

  # Environment & Config
  flutter_dotenv: ^5.2.1

  # Network & URLs
  url_launcher: ^6.3.2
  http: ^1.6.0

  # Storage & Caching
  shared_preferences: ^2.5.3

  # UI & Media
  cached_network_image: ^3.4.1

  # Device & System Info
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5

  # Desktop Integration (System Tray & Window Management)
  tray_manager: ^0.5.3

# Development Dependencies
  datapkg: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter / Code Style
  flutter_lints: ^5.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

# Flutter specific configurations
flutter:
  uses-material-design: true

  # Assets & Resources
  assets:
    - .env
    - assets/images/
    - assets/taxonomies/

  # Custom Fonts
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/vazir.ttf

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  linux:
    enable: true
  windows:
    enable: true
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true