# General Section (Metadata)
name: datapack
description: "Datapack is an official tool for managing, installing, uninstalling, and updating DataistOS software packages."
homepage: datapack
documentation: https://dpic.dataist.ir/
version: 0.2.0+1

# Environment
environment:
  sdk: ^3.8.1

# Dependencies
dependencies:
  flutter:
    sdk: flutter

  # Environment & Config
  flutter_dotenv: ^5.2.1

  # Network & URLs
  url_launcher: ^6.3.2
  http: ^1.6.0

  # State Management
  provider: ^6.1.5+1

  # Cached Image Loading
  cached_network_image: ^3.4.1

# Development Dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter / Code Style
  flutter_lints: ^5.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

# Flutter specific configurations
flutter:
  uses-material-design: true

  # Assets & Resources
  assets:
    - .env
    - assets/images/

  # Custom Fonts
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/vazir.ttf

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true